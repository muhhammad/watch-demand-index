services:
  postgres:
    image: postgres:15
    container_name: watch_postgres
    environment:
      POSTGRES_DB: watchdb
      POSTGRES_USER: watchuser
      POSTGRES_PASSWORD: watchpass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ingestion/init:/docker-entrypoint-initdb.d
      - ./ingestion:/ingestion
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: watch_api
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: watchdb
      DB_USER: watchuser
      DB_PASSWORD: watchpass
      ALLOWED_ORIGINS: http://localhost:5173
      SECRET_KEY: change-me-for-local-dev
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: watch_dashboard
    ports:
      - "5173:5173"
    depends_on:
      - api
    environment:
      VITE_API_BASE_URL: http://localhost:8000
      PORT: 5173
    restart: unless-stopped

volumes:
  pgdata:
